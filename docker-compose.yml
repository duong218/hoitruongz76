services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql # dữ liệu SQL Server nằm ở đây, tắt/xóa container không mất

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mssql]
    environment:
      PORT: 5000
      DB_SERVER: mssql
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-hoitruongz76}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      CLIENT_ORIGIN: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD}

  web:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443" # chỉ dùng khi có tên miền
    volumes:
      - caddy-data:/data # giữ chứng chỉ HTTPS

volumes:
  mssql-data:
  caddy-data:
